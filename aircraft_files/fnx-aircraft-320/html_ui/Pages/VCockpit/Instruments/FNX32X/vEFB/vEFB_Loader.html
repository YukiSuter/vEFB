<!DOCTYPE HTML>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>BAW BAVMS</title>
    <meta name="description" content="Fenix A320 EFB">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <link rel="icon" type="image/x-icon" href="img/Bob_Icon_x256.png" />
    <link rel='stylesheet' href='styles.css' />
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        overflow: hidden;
      }

      #boot {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 100000;
        text-align: center;
        background-image: radial-gradient(circle, #0d0d0c, #0a0a09, #070606, #040303, #000000)
      }

      #errItem {
        position: absolute;
        left: 50%;
        top: 50%;
        height: 50%;
        transform: translate(-50%,-50%);
        z-index: 100002;
        color: white;
        font-size: 30px;
        letter-spacing: 2px
      }

      #errItem img {
        width: 400px;
      }
    </style>
  </head>

  <body>
    <div id="boot">
      <div id="errItem">
        <img src="alert1.png"/><br /><br />
        vEFB NOT LOADED<br />Failed to load vEFB. Please make sure the vEFB companion program is open.
      </div>
    </div>
  </body>
</html>

<script>
  let checkInterval = null;

  // Attempt to connect and load the EFB every 1s. Once successful, clear the interval.
  document.body.onload = () => {
    checkAndLoadEFBWebApp();
  };

  function checkAndLoadEFBWebApp() {
    console.log("Checking for success")
    fetch('http://localhost:8083')
      .then(_ => {
        console.log("Fetch succeeded")
        window.location.replace('http://localhost:8083/index_capt.html');

        clearInterval(checkInterval);
      })
      .catch(err => {
        console.log('Failed to connect to BAVMS', err);
      });
  }
</script>
